<svg xmlns="http://www.w3.org/2000/svg"
  class="die die-d2"
  width="128" height="128" viewBox="0 0 100 100"
  fill="none" stroke="currentColor" stroke-width="2.2"
  stroke-linecap="round" stroke-linejoin="round"
  role="img" aria-label="Two-sided die">
  <circle class="die-outline" cx="50" cy="50" r="45"/>
  <text class="die-value" data-slot="value"
    x="50" y="50" text-anchor="middle" dominant-baseline="central"
    font-size="22" data-max-width="62" fill="currentColor" stroke="none"></text>
</svg>
